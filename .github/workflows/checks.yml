name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-and-patches:
    strategy:
      matrix:
        cosmic: ["1.10.0", "1.11.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check scripts and installer lifecycle
        run: |
          bash -n install.sh uninstall.sh build-from-source.sh
          ./install.sh --help
          ./install.sh --from-source --help
          ./uninstall.sh --help
          python3 -m unittest discover -s tests -v
      - name: Check both patches against the pinned upstream commits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, sys
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from build_source import prepare
          import release_config
          root = Path.cwd()
          work = Path(os.environ['RUNNER_TEMP']) / 'penumbra-patch-check'
          work.mkdir()
          release = release_config.select(json.loads((root / 'release.json').read_text()), '${{ matrix.cosmic }}')
          prepare(root, work, release)
          PY
